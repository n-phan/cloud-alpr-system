AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ALPR backend — all Lambda functions and the GET /get-citations API Gateway integration.
  Functions originally created manually were imported into this stack via CloudFormation
  resource import so that all infrastructure is now managed as IaC.

Parameters:
  ExistingApiId:
    Type: String
    Default: o5h6jttjtc
    Description: REST API ID of the existing alpr-api API Gateway

  ExistingApiRootResourceId:
    Type: String
    Default: d9mbk9yx3f
    Description: Root (/) resource ID of the existing API Gateway

Globals:
  Function:
    Runtime: python3.11
    MemorySize: 256
    Timeout: 30

Resources:

  # ── S3 bucket policy ─────────────────────────────────────────────────────────

  IngressBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    Properties:
      Bucket: alpr-ingress-cmpe281
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: arn:aws:s3:::alpr-ingress-cmpe281/*

  # ── Lambda functions ─────────────────────────────────────────────────────────
  # DeletionPolicy: Retain on all functions prevents accidental deletion
  # if the CloudFormation stack is ever torn down.

  PresignedUrlGeneratorFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: presigned-url-generator
      CodeUri: lambda/presigned-url-generator/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole
      Environment:
        Variables:
          S3_BUCKET_NAME: alpr-images-bucket

  PermitCheckerFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: permit-checker
      CodeUri: lambda/permit-checker/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole

  EventRetrieverFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: event-retriever
      CodeUri: lambda/event-retriever/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole

  PlateSubmissionHandlerFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: plate-submission-handler
      CodeUri: lambda/plate-submission-handler/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole

  ValidationBacklogHandlerFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: validation-backlog-handler
      CodeUri: lambda/validation-backlog-handler/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole
      Environment:
        Variables:
          CONFIDENCE_THRESHOLD: "0.7"
          VALIDATION_BACKLOG_TABLE: ValidationBacklog

  ValidationBacklogAdminHandlerFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: validation-backlog-admin-handler
      CodeUri: lambda/validation-backlog-admin-handler/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole
      Environment:
        Variables:
          VALIDATION_BACKLOG_TABLE: ValidationBacklog
          LIST_DEFAULT_LIMIT: "50"
          LIST_MAX_LIMIT: "100"

  GateEventsStreamRouterFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: gateevents-stream-router
      CodeUri: lambda/gateevents-stream-router/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole
      Environment:
        Variables:
          CONFIDENCE_THRESHOLD: "0.7"
          DETECTION_AUTO_CITATION_CONFIDENCE: "0.7"
          DETECTION_IDEMPOTENCY_BUCKET_MINUTES: "15"
          GRACE_PERIOD_MINUTES: "15"
          MATCHING_WINDOW_MINUTES: "240"
          ORPHAN_POLICY: "review"
          PERMIT_CHECKER_FUNCTION: permit-checker
          VALIDATION_BACKLOG_FUNCTION: validation-backlog-handler
          CITATION_CREATE_FUNCTION: citation-create-handler
          GATE_EVENTS_TABLE: GateEvents
          GATE_EVENTS_PLATE_TEXT_INDEX: plate_text-timestamp-index

  CitationCreateHandlerFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: citation-create-handler
      CodeUri: lambda/citation-create-handler/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole
      Environment:
        Variables:
          CITATIONS_TABLE: Citations
          DEFAULT_CITATION_AMOUNT: "100"
          CITATIONS_OCCURRENCE_KEY_INDEX: occurrence_key-index

  S3UploaderFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: s3-uploader
      CodeUri: lambda/s3-uploader/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole

  CitationLookupFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: citation-lookup-handler
      CodeUri: lambda/citation-lookup-handler/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole
      Environment:
        Variables:
          CITATIONS_TABLE: Citations

  PermitAdminHandlerFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: permit-admin-handler
      CodeUri: lambda/permit-admin-handler/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole
      Environment:
        Variables:
          PERMITS_TABLE: Permits

  CitationAdminHandlerFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: citation-admin-handler
      CodeUri: lambda/citation-admin-handler/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole
      Environment:
        Variables:
          CITATIONS_TABLE: Citations
          LIST_DEFAULT_LIMIT: "50"
          LIST_MAX_LIMIT: "200"

  OrphanScanHandlerFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: orphan-scan-handler
      CodeUri: lambda/orphan-scan-handler/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole
      Timeout: 300
      Environment:
        Variables:
          GATE_EVENTS_TABLE: GateEvents
          GATE_EVENTS_PLATE_TEXT_INDEX: plate_text-timestamp-index
          MATCHING_WINDOW_MINUTES: "240"
          GRACE_PERIOD_MINUTES: "15"
          ORPHAN_POLICY: review
          PERMIT_CHECKER_FUNCTION: permit-checker
          VALIDATION_BACKLOG_FUNCTION: validation-backlog-handler
          CITATION_CREATE_FUNCTION: citation-create-handler

  # ── EventBridge Scheduler: orphan scan ───────────────────────────────────────
  # Scheduler assumes OrphanScanSchedulerRole when firing; the Lambda permission
  # below allows scheduler.amazonaws.com to invoke the function.

  OrphanScanSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: alpr-orphan-scan-scheduler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeOrphanScanLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt OrphanScanHandlerFunction.Arn

  OrphanScanSchedulerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt OrphanScanHandlerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: scheduler.amazonaws.com
      SourceArn: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/*"

  OrphanScanSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: alpr-orphan-scan
      Description: Re-evaluates GateEvents stuck in waiting-for-counterpart after the matching window expires
      ScheduleExpression: "rate(1 hour)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt OrphanScanHandlerFunction.Arn
        RoleArn: !GetAtt OrphanScanSchedulerRole.Arn
        Input: "{}"

  # ── API Gateway: GET /get-citations ─────────────────────────────────────────
  # Only this route is managed here — existing routes were wired manually
  # and continue to work independently.

  GetCitationsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ExistingApiId
      ParentId: !Ref ExistingApiRootResourceId
      PathPart: get-citations

  GetCitationsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref GetCitationsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CitationLookupFunction.Arn}/invocations

  GetCitationsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref GetCitationsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  CitationLookupApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt CitationLookupFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingApiId}/*/GET/get-citations"

  # ── API Gateway: GET+PUT /validation-backlog ────────────────────────────────

  ValidationBacklogResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ExistingApiId
      ParentId: !Ref ExistingApiRootResourceId
      PathPart: validation-backlog

  ValidationBacklogGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref ValidationBacklogResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ValidationBacklogAdminHandlerFunction.Arn}/invocations

  ValidationBacklogPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref ValidationBacklogResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ValidationBacklogAdminHandlerFunction.Arn}/invocations

  ValidationBacklogOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref ValidationBacklogResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,PUT,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ValidationBacklogApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ValidationBacklogAdminHandlerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingApiId}/*/*/validation-backlog"

  # ── API Gateway: GET+POST+PUT /permits ──────────────────────────────────────

  PermitsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ExistingApiId
      ParentId: !Ref ExistingApiRootResourceId
      PathPart: permits

  PermitsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref PermitsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PermitAdminHandlerFunction.Arn}/invocations

  PermitsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref PermitsResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PermitAdminHandlerFunction.Arn}/invocations

  PermitsPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref PermitsResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PermitAdminHandlerFunction.Arn}/invocations

  PermitsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref PermitsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  PermitAdminApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PermitAdminHandlerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingApiId}/*/*/permits"

  # ── API Gateway: GET+PUT /admin-citations ──────────────────────────────────

  AdminCitationsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ExistingApiId
      ParentId: !Ref ExistingApiRootResourceId
      PathPart: admin-citations

  AdminCitationsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref AdminCitationsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CitationAdminHandlerFunction.Arn}/invocations

  AdminCitationsPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref AdminCitationsResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CitationAdminHandlerFunction.Arn}/invocations

  AdminCitationsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref AdminCitationsResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CitationAdminHandlerFunction.Arn}/invocations

  AdminCitationsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref AdminCitationsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,PUT,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  CitationAdminApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt CitationAdminHandlerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingApiId}/*/*/admin-citations"

  ApiRedeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - GetCitationsMethod
      - GetCitationsOptionsMethod
      - ValidationBacklogGetMethod
      - ValidationBacklogPutMethod
      - ValidationBacklogOptionsMethod
      - PermitsGetMethod
      - PermitsPostMethod
      - PermitsPutMethod
      - PermitsOptionsMethod
      - AdminCitationsGetMethod
      - AdminCitationsPutMethod
      - AdminCitationsPostMethod
      - AdminCitationsOptionsMethod
    Properties:
      RestApiId: !Ref ExistingApiId
      StageName: prod
      Description: !Sub "Deployed by SAM stack ${AWS::StackName} — routes: get-citations, validation-backlog, permits, admin-citations (POST added)"

Outputs:
  CitationLookupFunctionArn:
    Description: ARN of the citation-lookup-handler Lambda
    Value: !GetAtt CitationLookupFunction.Arn

  GetCitationsEndpoint:
    Description: Public endpoint for citation lookup
    Value: !Sub "https://${ExistingApiId}.execute-api.${AWS::Region}.amazonaws.com/prod/get-citations"

  PermitsEndpoint:
    Description: Public endpoint for permit management (GET/POST/PUT)
    Value: !Sub "https://${ExistingApiId}.execute-api.${AWS::Region}.amazonaws.com/prod/permits"

  AdminCitationsEndpoint:
    Description: Admin endpoint for citation management (GET/PUT)
    Value: !Sub "https://${ExistingApiId}.execute-api.${AWS::Region}.amazonaws.com/prod/admin-citations"

  OrphanScanFunctionArn:
    Description: ARN of the orphan-scan-handler Lambda (triggered hourly by EventBridge Scheduler)
    Value: !GetAtt OrphanScanHandlerFunction.Arn
