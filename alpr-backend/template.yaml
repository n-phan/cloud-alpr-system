AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ALPR backend — all Lambda functions and the GET /get-citations API Gateway integration.
  Functions originally created manually were imported into this stack via CloudFormation
  resource import so that all infrastructure is now managed as IaC.

Parameters:
  ExistingApiId:
    Type: String
    Default: o5h6jttjtc
    Description: REST API ID of the existing alpr-api API Gateway

  ExistingApiRootResourceId:
    Type: String
    Default: d9mbk9yx3f
    Description: Root (/) resource ID of the existing API Gateway

Globals:
  Function:
    Runtime: python3.11
    MemorySize: 256
    Timeout: 30

Resources:

  # ── Lambda functions ─────────────────────────────────────────────────────────
  # DeletionPolicy: Retain on all functions prevents accidental deletion
  # if the CloudFormation stack is ever torn down.

  PresignedUrlGeneratorFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: presigned-url-generator
      CodeUri: lambda/presigned-url-generator/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole
      Environment:
        Variables:
          S3_BUCKET_NAME: alpr-images-bucket

  PermitCheckerFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: permit-checker
      CodeUri: lambda/permit-checker/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole

  EventRetrieverFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: event-retriever
      CodeUri: lambda/event-retriever/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole

  PlateSubmissionHandlerFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: plate-submission-handler
      CodeUri: lambda/plate-submission-handler/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole

  ValidationBacklogHandlerFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: validation-backlog-handler
      CodeUri: lambda/validation-backlog-handler/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole
      Environment:
        Variables:
          CONFIDENCE_THRESHOLD: "0.7"
          VALIDATION_BACKLOG_TABLE: ValidationBacklog

  ValidationBacklogAdminHandlerFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: validation-backlog-admin-handler
      CodeUri: lambda/validation-backlog-admin-handler/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole
      Environment:
        Variables:
          VALIDATION_BACKLOG_TABLE: ValidationBacklog
          LIST_DEFAULT_LIMIT: "50"
          LIST_MAX_LIMIT: "100"

  GateEventsStreamRouterFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: gateevents-stream-router
      CodeUri: lambda/gateevents-stream-router/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole
      Environment:
        Variables:
          CONFIDENCE_THRESHOLD: "0.7"
          PERMIT_CHECKER_FUNCTION: permit-checker
          VALIDATION_BACKLOG_FUNCTION: validation-backlog-handler
          CITATION_CREATE_FUNCTION: citation-create-handler

  CitationCreateHandlerFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: citation-create-handler
      CodeUri: lambda/citation-create-handler/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole
      Environment:
        Variables:
          CITATIONS_TABLE: Citations

  S3UploaderFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: s3-uploader
      CodeUri: lambda/s3-uploader/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole

  CitationLookupFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: citation-lookup-handler
      CodeUri: lambda/citation-lookup-handler/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole
      Environment:
        Variables:
          CITATIONS_TABLE: Citations

  PermitAdminHandlerFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    Properties:
      FunctionName: permit-admin-handler
      CodeUri: lambda/permit-admin-handler/
      Handler: handler.lambda_handler
      Role: arn:aws:iam::160885262272:role/ALPRLambdaExecutionRole
      Environment:
        Variables:
          PERMITS_TABLE: Permits

  # ── API Gateway: GET /get-citations ─────────────────────────────────────────
  # Only this route is managed here — existing routes were wired manually
  # and continue to work independently.

  GetCitationsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ExistingApiId
      ParentId: !Ref ExistingApiRootResourceId
      PathPart: get-citations

  GetCitationsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref GetCitationsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CitationLookupFunction.Arn}/invocations

  GetCitationsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref GetCitationsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  CitationLookupApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt CitationLookupFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingApiId}/*/GET/get-citations"

  # ── API Gateway: GET+PUT /validation-backlog ────────────────────────────────

  ValidationBacklogResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ExistingApiId
      ParentId: !Ref ExistingApiRootResourceId
      PathPart: validation-backlog

  ValidationBacklogGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref ValidationBacklogResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ValidationBacklogAdminHandlerFunction.Arn}/invocations

  ValidationBacklogPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref ValidationBacklogResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ValidationBacklogAdminHandlerFunction.Arn}/invocations

  ValidationBacklogOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref ValidationBacklogResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,PUT,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ValidationBacklogApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ValidationBacklogAdminHandlerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingApiId}/*/*/validation-backlog"

  # ── API Gateway: GET+POST+PUT /permits ──────────────────────────────────────

  PermitsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ExistingApiId
      ParentId: !Ref ExistingApiRootResourceId
      PathPart: permits

  PermitsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref PermitsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PermitAdminHandlerFunction.Arn}/invocations

  PermitsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref PermitsResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PermitAdminHandlerFunction.Arn}/invocations

  PermitsPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref PermitsResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PermitAdminHandlerFunction.Arn}/invocations

  PermitsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ExistingApiId
      ResourceId: !Ref PermitsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  PermitAdminApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PermitAdminHandlerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingApiId}/*/*/permits"

  ApiRedeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - GetCitationsMethod
      - GetCitationsOptionsMethod
      - ValidationBacklogGetMethod
      - ValidationBacklogPutMethod
      - ValidationBacklogOptionsMethod
      - PermitsGetMethod
      - PermitsPostMethod
      - PermitsPutMethod
      - PermitsOptionsMethod
    Properties:
      RestApiId: !Ref ExistingApiId
      StageName: prod
      Description: !Sub "Deployed by SAM stack ${AWS::StackName} — routes: get-citations, validation-backlog, permits"

Outputs:
  CitationLookupFunctionArn:
    Description: ARN of the citation-lookup-handler Lambda
    Value: !GetAtt CitationLookupFunction.Arn

  GetCitationsEndpoint:
    Description: Public endpoint for citation lookup
    Value: !Sub "https://${ExistingApiId}.execute-api.${AWS::Region}.amazonaws.com/prod/get-citations"

  PermitsEndpoint:
    Description: Public endpoint for permit management (GET/POST/PUT)
    Value: !Sub "https://${ExistingApiId}.execute-api.${AWS::Region}.amazonaws.com/prod/permits"
